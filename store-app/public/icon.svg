<?xml version="1.0" encoding="UTF-8"?>
<!-- 店小C 应用图标（1024 网格，maskable 安全）：
     满版品牌绿圆角方块（半径约 220）+ 居中白色奶滴。
     奶滴宽约 46%（471/1024），水平边距约 27%、垂直边距约 14.5%，
     位于 maskable 中心 80% 安全区之内，任何厂商裁剪形状下均不贴边、不被切。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- subtle 同系渐变：仅在 #00b451 邻近明度区间微调 -->
    <linearGradient id="dxc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c25a" />
      <stop offset="1" stop-color="#00a347" />
    </linearGradient>
  </defs>
  <!-- 满版圆角方块：maskable 要求背景铺满全幅，由系统负责外形遮罩 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#dxc-bg)" />
  <!-- 白色奶滴：24 网格原始路径，缩放 39.25 倍后居中（translate 41 / 31.2） -->
  <g transform="translate(41 31.2) scale(39.25)">
    <path d="M12 3C12 3 6 10.5 6 15.5a6 6 0 0 0 12 0C18 10.5 12 3 12 3z" fill="#ffffff" />
  </g>
</svg>
